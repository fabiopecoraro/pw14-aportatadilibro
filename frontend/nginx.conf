server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # L'applicazione usa il routing lato client: qualunque percorso sconosciuto
    # deve servire index.html, altrimenti un ricaricamento su /catalogo/<id>
    # restituirebbe 404 invece della schermata.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # I bundle prodotti da Angular hanno l'hash del contenuto nel nome: a
    # contenuto diverso corrisponde un nome diverso, quindi si possono mettere
    # in cache a tempo indeterminato senza rischio di servirne uno stantio.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        # Un solo add_header e non anche `expires`: userebbero entrambi
        # Cache-Control e la risposta ne porterebbe due.
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html invece non ha hash nel nome ed e' il file che elenca quali
    # bundle caricare: se finisce in cache, dopo un aggiornamento il browser
    # continua a chiedere i bundle della versione precedente e l'applicazione
    # resta indietro finche' non si svuota la cache a mano.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # In produzione environment.ts punta a percorsi relativi (`/api`,
    # `/hubs/chat`): con questo proxy front-end e API stanno sulla stessa
    # origine, quindi niente CORS, niente porte diverse e — soprattutto —
    # niente certificato di sviluppo da rendere attendibile per la demo.
    location /api/ {
        # Il limite predefinito di nginx sul corpo della richiesta e' 1 MB, e
        # la fotografia di una copertina fatta con il telefono lo supera quasi
        # sempre: senza alzarlo il caricamento verrebbe rifiutato con un 413
        # prima ancora di arrivare all'API, che l'immagine la ridimensiona.
        client_max_body_size 15m;
        proxy_pass http://api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # `^~` non e' decorativo: le copertine sono .jpg e senza quel modificatore
    # le prenderebbe il blocco regex qui sopra, che ha la precedenza su un
    # prefisso semplice. Non facendo proxy, nginx le cercherebbe fra i file
    # statici del frontend e risponderebbe 404: nella demo in compose nessuna
    # copertina comparirebbe mai.
    location ^~ /covers/ {
        proxy_pass http://api:8080/covers/;
    }

    # SignalR negozia e poi passa a WebSocket: senza Upgrade/Connection la
    # chat resterebbe bloccata sul long polling o fallirebbe del tutto.
    location /hubs/ {
        proxy_pass http://api:8080/hubs/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # La connessione della chat resta aperta a lungo senza traffico.
        proxy_read_timeout 3600s;
    }
}
